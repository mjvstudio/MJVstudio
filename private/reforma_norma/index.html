<body data-versions="1,2">

         versión 1 → images/, antes_despues/, 360/   |   versión 2 → 2_images/, 2_antes_despues/, 2_360/   |   versión 3 → 3_images/ ... y así.
         Al abrir el link sin nada más se ve la última versión; para compartir una en particular: .../reforma_norma/#v1, #v2... -->

        <div class="project-title lang-dropdown" id="pg-version-wrap">
            <h1><button type="button" class="pg-title-btn" id="pg-title-btn" aria-haspopup="true" aria-expanded="false"><span class="pg-title-text">Reforma Norma</span><span class="pg-chevron" aria-hidden="true"></span></button></h1>
            <div class="lang-dropdown-content pg-version-menu" id="pg-version-menu"></div>
        </div>
    </div>

    <!-- Logo: lleva a la página principal. La flecha solo aparece con una foto abierta y la cierra -->
    <a class="pg-home" id="pg-home" href="../../index.html" title="Volver a la página principal" aria-label="Volver a la página principal"><span class="pg-home-logo" aria-hidden="true"></span></a>
    <a href="#" class="back-to-projects-btn" id="pg-close" title="Cerrar foto">
        <img src="../../assets/back.svg" alt="Volver">
    </a>

    <!-- ⚠️ Este bloque de 3 botones se repite igual en cada página de proyecto -->

        <button class="theme-toggle-icon-btn js-theme-toggle" type="button" title="Cambiar a modo oscuro" aria-label="Cambiar a modo oscuro"><span class="pref-icon icon-night" aria-hidden="true"></span><span class="pref-icon icon-light" aria-hidden="true"></span></button>
        <button class="theme-toggle-icon-btn js-sound-toggle" type="button" title="Silenciar sonido" aria-label="Silenciar sonido"><span class="pref-icon icon-volume-on" aria-hidden="true"></span><span class="pref-icon icon-volume-off" aria-hidden="true"></span></button>
        <div class="lang-dropdown">
            <button class="theme-toggle-icon-btn js-lang-toggle" type="button" title="Idioma" aria-label="Idioma" aria-haspopup="true" aria-expanded="false"><span class="pref-icon icon-language" aria-hidden="true"></span></button>

    <!-- BOTÓN DE CONTACTO -->
    <div class="contact-dropdown">
        <img id="contact-button" src="../../assets/contact.svg" alt="Contacto" class="contact-icon">
        <div class="contact-dropdown-content" id="contact-dropdown">
            <a href="mailto:tucorreo@example.com?subject=Reforma%20Norma" style="--i: 0;"><img src="../../assets/email.svg" alt="Email"></a>

        </div>
    </div>

    <div class="swiper-container">
        <div class="swiper-wrapper">
            <!-- Sección 1: galería (fotos en images/01.webp, 02.webp, 03.webp... se detectan solas) -->
            <div class="swiper-slide">
                <main>
                    <div class="pg-gallery" id="pg-gallery"></div>
                    <p class="pg-empty" id="pg-empty" hidden data-en="The photos will be available very soon." data-fr="Les photos seront disponibles très bientôt." data-pt="As fotos estarão disponíveis em breve.">Las fotos estarán disponibles muy pronto.</p>
                    <div class="gallery-viewer swiper-no-swiping" id="pg-viewer" role="dialog" aria-hidden="true" tabindex="-1">
                        <div class="gv-stage">
                            <img class="gv-img" alt="" draggable="false">
                            <img class="gv-img" alt="" draggable="false">
                        </div>
                        <button type="button" class="gv-btn gv-prev"><span class="gv-icon" aria-hidden="true"></span></button>
                        <button type="button" class="gv-btn gv-next"><span class="gv-icon" aria-hidden="true"></span></button>
                    </div>
                </main>
            </div>

            <!-- Sección 2: recorrido 360 (versión 1: 360/, versión 2: 2_360/...; fuera del recuadro se puede deslizar para cambiar de sección; dentro, el arrastre es del recorrido) (exportado de Marzipano en la carpeta 360/; para actualizarlo, reemplazar esa carpeta) -->
            <div class="swiper-slide">
                <main>
                    <div class="pg-tour">
                        <iframe id="pg-tour-frame" title="Recorrido 360" allow="fullscreen; accelerometer; gyroscope" allowfullscreen></iframe>
                    </div>
                    <p class="pg-empty" id="pg-tour-empty" hidden data-en="The 360° tour of this version will be available very soon." data-fr="La visite 360° de cette version sera disponible très bientôt." data-pt="O passeio 360° desta versão estará disponível em breve.">El recorrido 360° de esta versión estará disponible muy pronto.</p>
                </main>
            </div>

            <!-- Sección 3: antes y después (antes_despues/antes.webp y despues.webp) -->
            <div class="swiper-slide">
                <main>
                    <div class="pg-compare-wrap">
                        <div class="pg-compare swiper-no-swiping" id="pg-compare">
                            <img class="cmp-before" alt="Antes" draggable="false">
                            <img class="cmp-after" alt="Después" draggable="false">
                            <span class="cmp-tag cmp-tag-before" data-en="Before" data-fr="Avant" data-pt="Antes">Antes</span>
                            <span class="cmp-tag cmp-tag-after" data-en="After" data-fr="Après" data-pt="Depois">Después</span>
                            <div class="cmp-handle" role="slider" tabindex="0" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50"><span class="cmp-knob"></span></div>
                        </div>
                    </div>
                    <p class="pg-empty" id="pg-compare-empty" hidden data-en="The before and after of this version will be available very soon." data-fr="L'avant et après de cette version sera disponible très bientôt." data-pt="O antes e depois desta versão estará disponível em breve.">El antes y después de esta versión estará disponible muy pronto.</p>
                </main>
            </div>
        </div>
        <div class="swiper-pagination"></div>
    </div>
