    <div class="utility-buttons">
        <button class="theme-toggle-icon-btn js-theme-toggle" type="button" title="Cambiar a modo oscuro" aria-label="Cambiar a modo oscuro"><span class="pref-icon icon-night" aria-hidden="true"></span><span class="pref-icon icon-light" aria-hidden="true"></span></button>
        <button class="theme-toggle-icon-btn js-sound-toggle" type="button" title="Silenciar sonido" aria-label="Silenciar sonido"><span class="pref-icon icon-volume-on" aria-hidden="true"></span><span class="pref-icon icon-volume-off" aria-hidden="true"></span></button>
        <div class="lang-dropdown">
            <button class="theme-toggle-icon-btn js-lang-toggle" type="button" title="Idioma" aria-label="Idioma" aria-haspopup="true" aria-expanded="false"><span class="pref-icon icon-language" aria-hidden="true"></span></button>

                <a href="#" data-lang-option="es" lang="es" style="--i: 3;">Español</a>

                <a href="#" data-lang-option="fr" lang="fr" style="--i: 1;">Français</a>
                <a href="#" data-lang-option="pt" lang="pt" style="--i: 0;">Português</a>
            </div>
        </div>
    </div>

    <div class="swiper-container">
        <div class="swiper-wrapper">
            <!-- Slide 1: Memoria -->
<div class="swiper-slide">
    <main>
        <div class="sub-section-container">
            <!-- Subsección izquierda (VISOR 3D — antes era una imagen estática) -->
            <div class="sub-section left memoria">
                <div class="modelo-3d-wrapper swiper-no-swiping">
                    <div class="loading-status" id="loading-status-memoria">Cargando modelo… 0%</div>
                    <!--
                        ⚠️ "modelo_vazquez.glb" es un modelo de PRUEBA para que puedas
                        ver el visor funcionando ya mismo. Cuando exportes el modelo
                        real desde SketchUp, subilo a esta misma carpeta con ese
                        nombre (o cambiá el "src" de abajo por el nombre que uses).
                    -->
                    <model-viewer
                        id="viewer-memoria"
                        src="modelo_vazquez.glb"
                        alt="Modelo 3D — Vázquez Automotores"
                        camera-controls
                        auto-rotate
                        auto-rotate-delay="2000"
                        rotation-per-second="15deg"
                        shadow-intensity="1"
                        shadow-softness="0.8"
                        exposure="1.1"
                        environment-image="neutral"
                        camera-orbit="35deg 75deg auto"
                        min-camera-orbit="auto 55deg auto"
                        max-camera-orbit="auto 95deg auto"
                        min-field-of-view="25deg"
                        max-field-of-view="45deg">
                    </model-viewer>
                </div>
            </div>

            <!-- Subsección derecha (texto) -->
            <div class="sub-section right memoria">
                <p id="memoria-text">Cargando descripción...</p>
            </div>
        </div>
    </main>
</div>
